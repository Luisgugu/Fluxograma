<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA para Preservação da Natureza - Fluxograma Interativo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 Como a IA auxilia o ser humano a preservar a natureza</h1>
            <p>Explore o fluxograma interativo abaixo</p>
        </header>

        <div class="flowchart-container">
            <svg id="flowchart" width="100%" height="800" viewBox="0 0 1200 800"></svg>
        </div>

        <div class="info-panel">
            <div id="nodeInfo" class="info-content">
                <p>Clique nos nós do fluxograma para mais informações</p>
            </div>
        </div>

        <!-- Modal/Pop-up -->
        <div id="modalOverlay" class="modal-overlay">
            <div class="modal-content">
                <button class="modal-close">&times;</button>
                <div id="modalInfo" class="modal-body">
                    <!-- Conteúdo será preenchido dinamicamente -->
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2024 - Preservação da Natureza com Inteligência Artificial</p>
        </footer>
    </div>

    <script src="data.js"></script>
    <script src="flowchart.js"></script>
</body>
</html>
